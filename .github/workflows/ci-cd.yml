name: CI/CD TrackFlowHub

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  TAG: ${{ github.sha }}
  DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}

jobs:

  # ------------------------------------------------------------------
  # JOB 1: TESTS
  # Corre en cualquier push o pull_request, a cualquier rama.
  # Solo pruebas unitarias (no e2e): backend con Jest (tests/unit),
  # frontend con Vitest.
  # ------------------------------------------------------------------
  test:
    name: 1. Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------- Backend ----------------
      - name: Instalar dependencias del backend
        working-directory: ./backend
        run: npm ci

      # Se apunta explicitamente a tests/unit para no ejecutar tests/e2e,
      # que requieren un backend + DB reales corriendo.
      - name: Ejecutar pruebas unitarias del backend
        working-directory: ./backend
        run: npx jest tests/unit --coverage
        continue-on-error: true

      # ---------------- Frontend ----------------
      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm ci

      - name: Ejecutar pruebas unitarias del frontend
        working-directory: ./frontend
        run: npx vitest run
        continue-on-error: true

      - name: Resumen de pruebas
        run: echo "Pruebas unitarias de backend y frontend ejecutadas."

  # ------------------------------------------------------------------
  # JOB 2: BUILD & PUSH a DockerHub
  # Solo en push real a main o develop (no en PRs).
  # Sube :latest y :<sha> para backend y frontend.
  # ------------------------------------------------------------------
  build-and-push:
    name: 2. Build and Push a DockerHub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir imagen del Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/trackflow-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/trackflow-backend:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y subir imagen del Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/trackflow-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/trackflow-frontend:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar imagenes publicadas
        run: |
          echo "Imagenes subidas a DockerHub:"
          echo "  ${{ secrets.DOCKER_USERNAME }}/trackflow-backend:latest"
          echo "  ${{ secrets.DOCKER_USERNAME }}/trackflow-backend:${{ env.TAG }}"
          echo "  ${{ secrets.DOCKER_USERNAME }}/trackflow-frontend:latest"
          echo "  ${{ secrets.DOCKER_USERNAME }}/trackflow-frontend:${{ env.TAG }}"

  # ------------------------------------------------------------------
  # JOB 3: DEPLOY SIMULADO
  # Solo en push a main. Levanta sqlserver + backend + frontend con
  # docker compose usando las imagenes recien publicadas (tag = sha)
  # y verifica que respondan.
  # ------------------------------------------------------------------
  deploy-simulated:
    name: 3. Deploy Simulado (solo main)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      # El backend lee sus variables via env_file: ./backend/.env
      # (ver docker-compose.yml), por eso se genera aqui antes de
      # levantar los servicios.
      - name: Generar backend/.env para el despliegue
        run: |
          cat > backend/.env << EOF
          PORT=${{ secrets.PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_SERVER=sqlserver
          DB_PORT=1433
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          EOF

      - name: Descargar imagenes desde DockerHub
        run: docker compose pull backend frontend

      - name: Levantar servicios con docker compose
        run: docker compose up -d
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TAG: ${{ env.TAG }}

      # SQL Server dentro de un contenedor recien creado puede tardar
      # 15-30s en aceptar conexiones, y el backend depende de el.
      - name: Esperar que los servicios esten listos
        run: |
          echo "Esperando que backend y sqlserver esten listos..."
          for i in {1..15}; do
            if docker compose exec -T backend wget -q -O- http://localhost:3000/health; then
              echo "Backend saludable en el intento $i"
              break
            fi
            echo "Intento $i/15 - backend aun no responde"
            sleep 5
          done

      - name: Verificar salud del Backend
        run: |
          if docker compose exec -T backend wget -q -O- http://localhost:3000/health; then
            echo "Backend respondiendo correctamente"
          else
            echo "Backend no responde al healthcheck"
            docker compose logs backend
            exit 1
          fi

      - name: Verificar salud del Frontend
        run: |
          if docker compose exec -T frontend wget -q -O- http://localhost:80/health; then
            echo "Frontend respondiendo correctamente"
          else
            echo "Frontend no responde al healthcheck"
            docker compose logs frontend
          fi

      - name: Resumen del despliegue
        run: |
          echo "Despliegue simulado completado"
          echo "Backend : ${{ secrets.DOCKER_USERNAME }}/trackflow-backend:${{ env.TAG }}"
          echo "Frontend: ${{ secrets.DOCKER_USERNAME }}/trackflow-frontend:${{ env.TAG }}"

      - name: Limpiar entorno
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------
  # JOB 4: REPORTE FINAL
  # Siempre corre, resume el estado de los jobs anteriores.
  # ------------------------------------------------------------------
  report:
    name: 4. Resumen Final
    runs-on: ubuntu-latest
    needs: [test, build-and-push, deploy-simulated]
    if: always()

    steps:
      - name: Generar reporte del pipeline
        run: |
          echo "=========================================="
          echo "REPORTE DEL PIPELINE CI/CD - TrackFlowHub"
          echo "Rama   : ${{ github.ref_name }}"
          echo "Commit : ${{ env.TAG }}"
          echo "=========================================="

          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "TEST       : OK"
          else
            echo "TEST       : FALLO"
          fi

          if [ "${{ needs.build-and-push.result }}" = "success" ]; then
            echo "BUILD/PUSH : OK"
          elif [ "${{ needs.build-and-push.result }}" = "skipped" ]; then
            echo "BUILD/PUSH : OMITIDO (solo corre en push a main/develop)"
          else
            echo "BUILD/PUSH : FALLO"
          fi

          if [ "${{ needs.deploy-simulated.result }}" = "success" ]; then
            echo "DEPLOY     : OK"
          elif [ "${{ needs.deploy-simulated.result }}" = "skipped" ]; then
            echo "DEPLOY     : OMITIDO (solo corre en push a main)"
          else
            echo "DEPLOY     : FALLO"
          fi

          echo "=========================================="