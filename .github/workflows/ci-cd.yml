name: CI/CD TrackFlowHub

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

env:
  TAG: ${{ github.sha }}
  DOCKERHUB_USER: wichopedia

jobs:

  test-backend:
    name: 1a. Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Instalar dependencias del backend
        working-directory: ./backend
        run: npm ci

      - name: Ejecutar pruebas unitarias (jest)
        working-directory: ./backend
        run: npm test -- --testPathPattern=tests/unit
        continue-on-error: true

  test-frontend:
    name: 1b. Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm ci

      - name: Ejecutar pruebas unitarias (vitest)
        working-directory: ./frontend
        run: npm run test:unit -- --run
        continue-on-error: true

      - name: Verificar que el build compila
        working-directory: ./frontend
        run: npm run build

  build-and-push:
    name: 2. Build and Push a DockerHub
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir imagen del Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/trackflow-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/trackflow-backend:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y subir imagen del Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/trackflow-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/trackflow-frontend:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-simulated:
    name: 3. Deploy Simulado (solo master)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Generar .env raiz para docker-compose
        run: |
          cat > .env << EOF
          DOCKERHUB_USER=${{ secrets.DOCKER_USERNAME }}
          TAG_VERSION=${{ env.TAG }}
          EOF

      - name: Generar backend/.env
        run: |
          cat > backend/.env << EOF
          PORT=3000
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_SERVER=sqlserver
          DB_PORT=1433
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          EOF

      - name: Descargar imagenes desde DockerHub
        run: docker compose pull

      - name: Levantar servicios con docker compose
        run: docker compose up -d

      - name: Esperar que el backend este saludable
        run: |
          echo "Esperando que el backend este listo..."
          for i in {1..20}; do
            if docker compose exec -T backend curl -f -s http://localhost:3000/health > /dev/null 2>&1; then
              echo "Backend saludable en el intento $i"
              break
            fi
            echo "Intento $i/20 - backend aun no responde"
            sleep 5
          done

      - name: Verificar salud del Backend
        run: |
          if docker compose exec -T backend curl -f -s http://localhost:3000/health; then
            echo "Backend respondiendo correctamente"
          else
            echo "Backend no responde al healthcheck"
            exit 1
          fi

      - name: Verificar que el Frontend sirve contenido
        run: |
          if docker compose exec -T frontend curl -f -s http://localhost:80/ > /dev/null; then
            echo "Frontend respondiendo correctamente"
          else
            echo "Frontend no responde"
          fi

      - name: Resumen del despliegue
        run: |
          echo "Despliegue simulado completado"
          echo "Backend : ${{ secrets.DOCKER_USERNAME }}/trackflow-backend:${{ env.TAG }}"
          echo "Frontend: ${{ secrets.DOCKER_USERNAME }}/trackflow-frontend:${{ env.TAG }}"

      - name: Limpiar entorno
        if: always()
        run: docker compose down -v

  report:
    name: 4. Resumen Final
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build-and-push, deploy-simulated]
    if: always()

    steps:
      - name: Generar reporte del pipeline
        run: |
          echo "=========================================="
          echo "REPORTE DEL PIPELINE CI/CD - TrackFlowHub"
          echo "Rama   : ${{ github.ref_name }}"
          echo "Commit : ${{ env.TAG }}"
          echo "=========================================="

          if [ "${{ needs.test-backend.result }}" = "success" ]; then
            echo "TEST BACKEND  : OK"
          else
            echo "TEST BACKEND  : FALLO"
          fi

          if [ "${{ needs.test-frontend.result }}" = "success" ]; then
            echo "TEST FRONTEND : OK"
          else
            echo "TEST FRONTEND : FALLO"
          fi

          if [ "${{ needs.build-and-push.result }}" = "success" ]; then
            echo "BUILD/PUSH    : OK"
          elif [ "${{ needs.build-and-push.result }}" = "skipped" ]; then
            echo "BUILD/PUSH    : OMITIDO (solo corre en push a main/develop)"
          else
            echo "BUILD/PUSH    : FALLO"
          fi

          if [ "${{ needs.deploy-simulated.result }}" = "success" ]; then
            echo "DEPLOY        : OK"
          elif [ "${{ needs.deploy-simulated.result }}" = "skipped" ]; then
            echo "DEPLOY        : OMITIDO (solo corre en push a main)"
          else
            echo "DEPLOY        : FALLO"
          fi

          echo "=========================================="